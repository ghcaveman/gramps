# GWizard FamilySearch Merge addon -- built by package_addon.py (from gramps_devutil).
# See addon_package.example.toml in gramps_devutil for every option.
#
# Depends on the GWizard File Merge addon, which is built from the
# gwizard_filemerge branch (its own addon_package.toml). This branch takes
# the shared gwizard modules from gwizard_filemerge unchanged; merge that
# branch into this one before a release so the two stay in step.

package = "GWizardFamilySearchMerge"

[registration]
id = "gwizardfsmerge"
name = "GWizard FamilySearch Merge"
description = "Family Tree Processing Tool to search FamilySearch profiles and relatives and compare/merge data side-by-side with the open Family Tree."
fname = "gwizardfsmerge.py"
toolclass = "GWizardFamilySearchMerge"
optionclass = "GWizardFamilySearchMergeOptions"
authors = ["Kevin White"]
authors_email = ["gocaveman@gmail.com"]
help_url = "https://gramps-project.org/wiki/index.php/Addon:GWizardFamilySearchMerge_Tool"
gramps_versions = ["5.2.0", "6.2.0"]

[files]
modules = [
    "gramps/gen/gwizard/gwizardfamilysearch.py",
    "gramps/gen/gwizard/gwizardfsprovenance.py",
    "gramps/gui/gwizard/gwizardfslauncher.py",
    "gramps/gui/gwizard/gwizardfsmergedialog.py",
    "gramps/plugins/tool/gwizardfsmerge.py",
    "gramps/plugins/tool/gwizardfssource.py",
    "gramps/plugins/tool/gwizardcitation*.py",
    "gramps/plugins/tool/gw_*.py",
]
tests = [
    "gramps/gen/gwizard/test/gwizardfamilysearch_test.py",
    "gramps/gui/gwizard/test/gwizardfslauncher_test.py",
    "gramps/plugins/tool/test/gwizardfssource_test.py",
    "gramps/plugins/tool/test/gw_*_test.py",
]
test_helpers = [
    "gramps/plugins/tool/test/gwizard_gtk_fakes.py",
]
exclude = [
    "gramps/plugins/tool/gw_fixmediareferencesdialog.py",
    "gramps/plugins/tool/gw_mediapreview.py",
]

# Citation Fix: a second Tools menu entry in the combined addon package.
[[extra_registrations]]
id = "gwizardcitationfix"
name = "GWizard Citation Fix"
description = "Wizard-style cleanup of repositories, sources, citations and notes in the open Family Tree."
fname = "gwizardcitationfix.py"
toolclass = "GWizardCitationFix"
optionclass = "GWizardCitationFixOptions"
authors = ["Kevin White"]
authors_email = ["gocaveman@gmail.com"]
help_url = "https://gramps-project.org/wiki/index.php/Addon:GWizardCitationFix_Tool"
gramps_versions = ["5.2.0", "6.2.0"]

# The GWizard Multi-Archive Record Scan: a second Tools menu entry in the same addon. It
# lists every person with the record sources (WikiTree, NARA, ...) other
# GWizard addons register as GENERAL plugins in category GWizardRecordSource.
[[extra_registrations]]
id = "gwizardrecordscan"
name = "Multi-Archive Record Scan"
description = "Check every person in the Family Tree against the installed GWizard record sources (WikiTree, NARA, ...), count the likely matches at three match levels, and open a merge window for a match."
fname = "gwizard_filemerge_scan.py"
toolclass = "GWizardRecordScan"
optionclass = "GWizardRecordScanOptions"
authors = ["Kevin White"]
authors_email = ["gocaveman@gmail.com"]
category = "GWizardRecordSource"
load_on_reg = true
gramps_versions = ["5.2.0", "6.2.0"]

# The shared gwizard modules ship in GWizardFileMerge.
[[dependencies]]
id = "gwizardmerge"
package = "GWizardFileMerge"
modules = [
    "gramps/gen/gwizard/gwizard_base.py",
    "gramps/gen/gwizard/gwizard_filemerge_recordscan.py",
    "gramps/gen/gwizard/gwizardaltmatch.py",
    "gramps/gen/gwizard/gwizardgedcom.py",
    "gramps/gui/gwizard/gwizardaltcompare.py",
    "gramps/gui/gwizard/gwizardcompare.py",
    "gramps/gui/gwizard/gwizardlauncher.py",
    "gramps/gui/gwizard/gwizardmergedialog.py",
    "gramps/plugins/tool/gwizardmerge.py",
]

[[dependencies]]
id = "gwizardmediafix"
package = "MediaFix"
modules = [
    "gramps/plugins/tool/gwizardmediafix.py",
    "gramps/plugins/tool/gwizard_mediafix_common.py",
    "gramps/plugins/tool/gw_fixmediareferencesdialog.py",
    "gramps/plugins/tool/gw_mediapreview.py",
]

[check]
base = ["functionality_base", "origin/functionality_base"]
ignore = [
    "featuredocs/**",
    "*.md",
    "*.txt",
    "gramps/gen/gwizard/__init__.py",
    "gramps/gui/gwizard/__init__.py",
    "gramps/gen/gwizard/test/__init__.py",
    "gramps/gui/gwizard/test/__init__.py",
    "gramps/gen/gwizard/test/gwizard_test.py",
    "gramps/gen/gwizard/test/gwizard_*_test.py",
    "gramps/gen/gwizard/test/data/**",
    "gramps/gui/gwizard/test/gwizard_*_test.py",
    "gramps/plugins/tool/test/gwizardmerge*_test.py",
    "gramps/gen/gwizard/gwizard_filemerge_*.py",
    "gramps/gui/gwizard/gwizard_filemerge_*.py",
    "gramps/plugins/tool/gwizard_filemerge_*.py",
    "gramps/plugins/tool/test/gwizard_filemerge_*_test.py",
    # Media Fix tests come with the dependency; MediaFix ships them.
    "gramps/plugins/tool/test/gwizardmediafix*_test.py",
    "gramps/plugins/tool/test/gwizard_mediafix_common_test.py",
    "gramps/plugins/tool/tools.gpr.py",
    "po/POTFILES.in",
    "po/POTFILES.skip",
]
