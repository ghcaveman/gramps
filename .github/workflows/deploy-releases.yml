name: Compile & Deploy Gramps Releases

on:
  push:
    tags:
      - 'gg-*'

jobs:
  build-windows:
    uses: ./.github/workflows/windows-aio.yml
    with:
      build-number: '1'
      cleanup: false

  build-macos:
    uses: ./.github/workflows/build_mac.yml
    with:
      build-number: '1'

  build-linux:
    uses: ./.github/workflows/build_deb.yml
    with:
      build-number: '1'

  create-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Fetch Windows Package
      uses: actions/download-artifact@v4
      with:
        pattern: GrampsAIO-*
        path: ./artifacts
        merge-multiple: true

    - name: Fetch macOS Package
      uses: actions/download-artifact@v4
      with:
        pattern: Gramps_mac_*
        path: ./artifacts
        merge-multiple: true

    - name: Fetch Linux Package
      uses: actions/download-artifact@v4
      with:
        pattern: Gramps_deb_*
        path: ./artifacts
        merge-multiple: true

    - name: Publish Official Multi-Platform Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      run: |
        # SignPath Foundation requires every download page to describe the
        # software and link to the "Code signing policy". --notes is
        # prepended to the generated notes.
        NOTES="GoatGramps is a free, open-source genealogy program based on Gramps, with added tools for cleaning up and extending a Family Tree. See [what's different from Gramps](${REPO_URL}/blob/goatgramps/core/CHANGES.md).

        Downloads: Windows installer (\`.exe\`), macOS (\`.dmg\`) and Linux (\`.deb\`).

        **[Code signing policy](${REPO_URL}/blob/goatgramps/core/CODE_SIGNING_POLICY.md)** · [Privacy policy](${REPO_URL}/blob/goatgramps/core/CODE_SIGNING_POLICY.md#privacy-policy)"
        gh release create "${{ github.ref_name }}" \
          ./artifacts/* \
          --title "GoatGramps ${{ github.ref_name }}" \
          --notes "$NOTES" \
          --generate-notes
